<div class="auth-wrapper">
  <!-- Glowing background elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="auth-card glass-card">
    <div class="auth-header">
      <div class="brand-badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
      </div>
      <h2>Welcome to <span class="text-blue">PortfolioPro</span></h2>
      <p class="auth-subtitle">Institutional-Grade Stock Trading & Portfolio Terminal</p>
    </div>

    <!-- Live Paper Trading Banner -->
    <div class="demo-banner">
      <div class="demo-info">
        <span class="demo-pill">TEST DRIVE</span>
        <span class="text-xs text-secondary">Start with <strong>$100,000</strong> simulated cash</span>
      </div>
      <button type="button" class="demo-fill-btn" (click)="fillDemo()">Autofill Demo</button>
    </div>

    <!-- Alert / Error -->
    <div class="alert alert-danger" *ngIf="errorMessage">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <div class="input-icon-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input
            id="username"
            type="text"
            placeholder="e.g. trader_demo"
            [(ngModel)]="credentials.username"
            name="username"
            required
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a class="forgot-link text-xs text-blue">Forgot password?</a>
        </div>
        <div class="input-icon-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            id="password"
            type="password"
            placeholder="••••••••••••"
            [(ngModel)]="credentials.password"
            name="password"
            required
            autocomplete="current-password"
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full submit-btn" [disabled]="loading">
        <span *ngIf="loading" class="spinner-small"></span>
        <span *ngIf="!loading">Sign In to Terminal</span>
      </button>
    </form>

    <div class="auth-footer">
      <span class="text-sm text-secondary">Don't have an account?</span>
      <a routerLink="/register" class="text-sm text-blue font-semi">Create Account</a>
    </div>

    <!-- Security assurance -->
    <div class="security-note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>256-bit SSL encrypted • JWT Stateless Authentication</span>
    </div>
  </div>
</div>
