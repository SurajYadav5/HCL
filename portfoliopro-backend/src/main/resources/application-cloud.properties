# ==============================================================================
# PortfolioPro Cloud Deployment Profile (Render / Railway / Cloud Services)
# Supports free cloud deployment with automatic in-memory H2 fallback and demo data
# ==============================================================================

# Server
server.port=${PORT:10000}
server.servlet.context-path=/api
spring.main.allow-circular-references=true

# Database: Auto-configured to H2 In-Memory (Zero external cloud DB cost or setup required!)
# If a cloud MySQL URL is provided, it automatically switches to MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:portfoliopro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:PortfolioProSecretKey2024ThisIsAVeryLongSecretKeyForJWTSigningAlgorithmHS512}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Alpha Vantage Mock / Real Key
app.alphavantage.api-key=${APP_ALPHAVANTAGE_API_KEY:DEMO_KEY}
app.alphavantage.base-url=https://www.alphavantage.co/query

# CORS (Allow Vercel frontend, localhost, and custom domains)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,https://*.vercel.app}

# OpenAPI & Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
