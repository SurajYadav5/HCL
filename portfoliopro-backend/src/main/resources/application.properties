# PortfolioPro Application Configuration

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfoliopro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:PortfolioProSecretKey2024ThisIsAVeryLongSecretKeyForJWTSigningAlgorithmHS512}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Alpha Vantage API
app.alphavantage.api-key=${APP_ALPHAVANTAGE_API_KEY:YOUR_ALPHA_VANTAGE_API_KEY}
app.alphavantage.base-url=https://www.alphavantage.co/query

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}

# Cache
spring.cache.type=simple

# Logging
logging.level.com.portfoliopro=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
